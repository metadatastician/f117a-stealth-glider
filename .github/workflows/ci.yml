# SPDX-License-Identifier: MPL-2.0
#
# The real gate for F117A Stealth Glider. Every step here can fail; none of them
# is annotate-only. If you add a step, make sure it can actually go red — a
# check that cannot fail is worse than no check, because it reads as coverage.
#
# The project has zero dependencies -- no package manager, no lockfile, no
# install step -- so the only thing CI needs is a runtime. That runtime is Bun:
# Node is banned estate-wide. ubuntu-latest does NOT ship Bun, so setup-bun is
# the one and only `uses:` that exists for tooling here.
#
# NOTE for anyone changing the runtime again: `src/build.mjs` must never name a
# runtime binary as a literal string. It uses `process.execPath`, which
# re-invokes whichever runtime is executing it. An earlier version hardcoded
# `node` in an execSync, which meant a CI swap to Bun would still have shelled
# out to the host's Node -- a green pipeline that never ran the new runtime.
#
# Every `uses:` is pinned to a full commit SHA: the org enforces
# sha_pinning_required, and a tag ref produces startup_failure at 0s -- which
# reports as NO check rather than a red one, so it is invisible in `gh pr checks`.
#
# Code scanning is NOT here: it runs via GitHub code-scanning default setup
# (actions + javascript, extended suite, weekly). An advanced codeql.yml would
# conflict with default setup and fail permanently.

name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ledger:
    name: verification ledger
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Node version
        run: bun --version

      - name: Licence headers on every source file
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            if [ "$(head -1 "$f")" != "// SPDX-License-Identifier: MPL-2.0" ]; then
              echo "::error file=$f::missing SPDX MPL-2.0 header"; fail=1
            fi
          done < <(find src scripts design \( -name '*.mjs' -o -name '*.js' \))
          [ "$fail" = 0 ]

      - name: Gating ledger (C1..C12, complete)
        working-directory: src
        run: |
          set -euo pipefail
          for v in verify-kernel-parity verify-los verify-level verify-corridor verify-determinism verify-witness verify-falsifier verify-renderer verify-3d-rule-search; do
            echo "== bun $v.mjs =="
            bun "$v.mjs"
          done

      # C10: the committed bundle must be byte-identical to a fresh rebuild.
      # build.mjs itself syntax-checks the shipped script and replays the
      # witness on the transformed core, so this step also re-proves the
      # shipped artefact completable.
      - name: Bundle reproducibility (C10) — committed HTML matches a fresh rebuild
        run: |
          set -euo pipefail
          (cd src && bun build.mjs >/dev/null)
          if ! cmp -s src/f117a-stealth-glider.html f117a-stealth-glider.html; then
            echo "::error::committed f117a-stealth-glider.html is stale — run 'just build' and commit"
            exit 1
          fi
          rm -f src/f117a-stealth-glider.html
          echo "bundle reproducible"

      # verify-kernel-parity already proves this offline via git blob ids. This
      # step is a second, INDEPENDENT witness computed by git itself rather than
      # by our own reimplementation of the blob hash.
      - name: Vendored engine blob id matches f19@4af642af
        run: |
          set -euo pipefail
          got="$(git hash-object src/kernel/engine.mjs)"
          want="e9a26afe7736baa7faab35b582e01e30951b91b1"
          echo "engine.mjs blob: $got"
          if [ "$got" != "$want" ]; then
            echo "::error::vendored engine.mjs has diverged from f19 (want $want)"
            exit 1
          fi

  # The C6 falsifier used to run here as a separate KNOWN-RED job that was
  # allowed to fail without failing the build. It is green now and gates from
  # inside `ledger`, exactly as that job's comment said it should one day.
  # A contractile probe (ci-runs-the-cited-ledger) now forbids reintroducing
  # a fail-allowed job here.

  beats:
    name: C13 - no launch beat is a dead end
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Its own job purely for RUNTIME: 15 full state-space searches plus 15
    # flights is ~80s, which does not belong in the fast local ledger loop.
    # It gates like everything else here.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: C13 - every launch beat admits a route
        working-directory: src
        run: bun verify-beats.mjs

  contracts:
    name: contractile probes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      # Every `- run:` probe in machine-readable/contractiles/ is a shell
      # one-liner, so they are executed for real rather than read as prose.
      # Fails the build on any `critical` breach.
      - name: Execute the contractile probes
        run: bun scripts/contractiles.mjs

      - name: SPDX identifier present on every .a2ml file
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            if ! head -3 "$f" | grep -q 'SPDX-License-Identifier:'; then
              echo "::error file=$f::missing SPDX identifier"; fail=1
            fi
          done < <(find . -name '*.a2ml' -not -path './.git/*')
          [ "$fail" = 0 ]

      - name: Every action is pinned to a full commit SHA
        run: |
          set -euo pipefail
          if grep -rhoE 'uses: *[A-Za-z0-9_.-]+/[A-Za-z0-9_./-]+@[^ ]+' .github/workflows/ \
             | grep -vE '@[0-9a-f]{40}$'; then
            echo "::error::the above action refs are not pinned to a 40-character commit SHA"
            exit 1
          fi
          echo "all action refs are SHA-pinned"

      - name: No unsubstituted template placeholders
        run: |
          set -euo pipefail
          if grep -rlE '[{]{2}[A-Z][A-Z0-9_]*[}]{2}' --exclude-dir=.git . ; then
            echo "::error::the files above still contain template placeholders"
            exit 1
          fi
          echo "no template placeholders remain"

      # spike/ is provenance: byte-identical, or it is not provenance. The
      # digests are published in spike/README.md and .gitattributes exempts the
      # directory from eol normalisation so they survive git storage.
      - name: v0 spike digests unchanged
        run: |
          set -euo pipefail
          cat > /tmp/spike.sha <<'EOF'
          a7689fe15d8a00957bb445d451084043377cd98421f0676eca6546dc2c93ba1a  spike/world.html
          9756d73f4e025991955d975b8746ed70299280622b9ac516d9870fc0eb7fd1d9  spike/simulation.html
          EOF
          sed -i 's/^ *//' /tmp/spike.sha
          sha256sum -c /tmp/spike.sha

      # Root shape, in BOTH directions, against machine-readable/root-allow.txt:
      # an unlisted root entry fails, and a listed required entry that goes
      # missing fails. Added 2026-09-02 when the repo was retrofitted to the
      # RSR root-shape contract (the script is rsr-template-repo@2283f12's).
      - name: Root shape matches machine-readable/root-allow.txt
        run: bash scripts/check-root-shape.sh .
