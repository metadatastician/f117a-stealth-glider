<script>
// SPDX-License-Identifier: AGPL-3.0-or-later
// Copyright (c) 2026 Jonathan D.A. Jewell (hyperpolymath) <j.d.a.jewell@open.ac.uk>
// F19 Stealth Glider — core engine. B3/S23, bounded grid, outside is permanently dead.

function mkGrid(W, H) { return new Uint8Array(W * H); }

function step(src, dst, W, H) {
  for (let y = 0; y < H; y++) {
    const y0 = y > 0, y1 = y < H - 1;
    for (let x = 0; x < W; x++) {
      const i = y * W + x;
      let n = 0;
      const x0 = x > 0, x1 = x < W - 1;
      if (y0) { const r = i - W; if (x0) n += src[r - 1]; n += src[r]; if (x1) n += src[r + 1]; }
      if (x0) n += src[i - 1];
      if (x1) n += src[i + 1];
      if (y1) { const r = i + W; if (x0) n += src[r - 1]; n += src[r]; if (x1) n += src[r + 1]; }
      dst[i] = (n === 3 || (src[i] && n === 2)) ? 1 : 0;
    }
  }
}

// --- RLE ---
function parseRLE(s) {
  const cells = [];
  let x = 0, y = 0, num = '';
  for (const line of s.split('\n')) {
    const t = line.trim();
    if (!t || t.startsWith('#') || t.startsWith('x')) continue;
    for (const ch of t) {
      if (ch >= '0' && ch <= '9') { num += ch; continue; }
      const n = num ? parseInt(num, 10) : 1; num = '';
      if (ch === 'b') x += n;
      else if (ch === 'o') { for (let k = 0; k < n; k++) cells.push([x + k, y]); x += n; }
      else if (ch === '$') { y += n; x = 0; }
      else if (ch === '!') return norm(cells).cells;
    }
  }
  return norm(cells).cells;
}

function norm(cells) {
  let mx = Infinity, my = Infinity;
  for (const [x, y] of cells) { if (x < mx) mx = x; if (y < my) my = y; }
  const out = cells.map(([x, y]) => [x - mx, y - my]).sort((a, b) => a[1] - b[1] || a[0] - b[0]);
  return { cells: out, ox: mx, oy: my };
}

function key(cells) { return norm(cells).cells.map(c => c.join(',')).join(';'); }

// 8 symmetries: sym = r*2+m, r in 0..3 rotations (90° CW), m mirror-x first
function xf(cells, sym) {
  const m = sym & 1, r = sym >> 1;
  let cs = cells.map(([x, y]) => m ? [-x, y] : [x, y]);
  for (let k = 0; k < r; k++) cs = cs.map(([x, y]) => [-y, x]);
  return norm(cs).cells;
}

function stamp(grid, W, cells, ox, oy) {
  const H = grid.length / W;
  for (const [x, y] of cells) {
    const gx = x + ox, gy = y + oy;
    if (gx < 0 || gy < 0 || gx >= W || gy >= H) throw new Error(`stamp out of bounds: ${gx},${gy}`);
    grid[gy * W + gx] = 1;
  }
}

function live(grid, W, H) {
  const out = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (grid[y * W + x]) out.push([x, y]);
  return out;
}

function pop(grid) { let s = 0; for (let i = 0; i < grid.length; i++) s += grid[i]; return s; }

// 8-connected clusters of live cells
function clusters(grid, W, H) {
  const seen = new Uint8Array(W * H), out = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    if (!grid[i] || seen[i]) continue;
    const q = [[x, y]], comp = []; seen[i] = 1;
    while (q.length) {
      const [cx, cy] = q.pop(); comp.push([cx, cy]);
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const nx = cx + dx, ny = cy + dy;
        if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
        const j = ny * W + nx;
        if (grid[j] && !seen[j]) { seen[j] = 1; q.push([nx, ny]); }
      }
    }
    out.push(comp);
  }
  return out;
}

// --- Patterns ---
const P = {
  gliderSE0: [[1, 0], [2, 1], [0, 2], [1, 2], [2, 2]],
  eater1: parseRLE('2o2b$bo2b$bobo$2b2o!'),           // fishhook
  block: [[0, 0], [1, 0], [0, 1], [1, 1]],
  blinker: [[0, 0], [1, 0], [2, 0]],
  beehive: parseRLE('b2ob$o2bo$b2o!'),
  boat: parseRLE('2ob$obo$bo!'),
  tub: parseRLE('bob$obo$bo!'),
  gun: parseRLE('24bo$22bobo$12b2o6b2o12b2o$11bo3bo4b2o12b2o$2o8bo5bo3b2o$2o8bo3bob2o4bobo$10bo5bo7bo$11bo3bo$12b2o!'),
};

// Derive the 4 glider phases + per-step anchor deltas for heading (+1,+1) by simulation.
function deriveGlider() {
  const W = 40, H = 40;
  let a = mkGrid(W, H), b = mkGrid(W, H);
  stamp(a, W, P.gliderSE0, 12, 12);
  const shapes = [], anchors = [];
  for (let t = 0; t < 9; t++) {
    const cs = live(a, W, H);
    const n = norm(cs);
    shapes.push(n.cells); anchors.push([n.ox, n.oy]);
    step(a, b, W, H); [a, b] = [b, a];
  }
  // sanity: phase 4 shape == phase 0 shape, anchor advanced (1,1)
  if (key(shapes[4]) !== key(shapes[0])) throw new Error('glider period != 4?');
  const d40 = [anchors[4][0] - anchors[0][0], anchors[4][1] - anchors[0][1]];
  if (d40[0] !== 1 || d40[1] !== 1) throw new Error('glider displacement != (1,1)/4: ' + d40);
  const deltas = [];
  for (let p = 0; p < 4; p++) deltas.push([anchors[p + 1][0] - anchors[p][0], anchors[p + 1][1] - anchors[p][1]]);
  return { shapes: shapes.slice(0, 4), deltas };
}

// Build glider tables for all 4 headings via mirroring. heading key: `${sx}${sy}` with s in {1,-1}
function gliderTables() {
  const base = deriveGlider(); // heading (+1,+1)
  const T = {};
  for (const sx of [1, -1]) for (const sy of [1, -1]) {
    const shapes = base.shapes.map(sh => norm(sh.map(([x, y]) => [sx > 0 ? x : -x, sy > 0 ? y : -y])).cells);
    const deltas = base.deltas.map(([dx, dy]) => [sx * dx, sy * dy]);
    T[`${sx},${sy}`] = { shapes, deltas };
  }
  return T;
}

// Exact-match scan: find any isolated glider (any heading, any phase) inside a window.
// Isolated = shape matches and the bbox expanded by 1 contains no other live cells.
function findGlider(grid, W, H, T, x0, y0, x1, y1, notInGrid) {
  for (const hk of Object.keys(T)) {
    const { shapes } = T[hk];
    for (let p = 0; p < 4; p++) {
      const sh = shapes[p];
      let bw = 0, bh = 0;
      for (const [x, y] of sh) { if (x + 1 > bw) bw = x + 1; if (y + 1 > bh) bh = y + 1; }
      for (let oy = Math.max(0, y0); oy <= Math.min(H - bh, y1); oy++) {
        for (let ox = Math.max(0, x0); ox <= Math.min(W - bw, x1); ox++) {
          let ok = true;
          // interior must match exactly; ring of 1 around bbox must be empty
          for (let yy = -1; yy <= bh && ok; yy++) for (let xx = -1; xx <= bw && ok; xx++) {
            const gx = ox + xx, gy = oy + yy;
            const v = (gx < 0 || gy < 0 || gx >= W || gy >= H) ? 0 : grid[gy * W + gx];
            const inShape = sh.some(([sx2, sy2]) => sx2 === xx && sy2 === yy) ? 1 : 0;
            if (v !== inShape) ok = false;
          }
          if (ok && notInGrid) {
            let allShadow = true;
            for (const [sx2, sy2] of sh) if (!notInGrid[(oy + sy2) * W + (ox + sx2)]) { allShadow = false; break; }
            if (allShadow) ok = false; // ambient glider — exists in the counterfactual too
          }
          if (ok) return { heading: hk.split(',').map(Number), phase: p, ox, oy };
        }
      }
    }
  }
  return null;
}


// SPDX-License-Identifier: AGPL-3.0-or-later
// Copyright (c) 2026 Jonathan D.A. Jewell (hyperpolymath) <j.d.a.jewell@open.ac.uk>
//
// F117A Stealth Glider — radar line-of-sight. NEW in this repository; the f19
// kernel has no equivalent. No DOM, no randomness, no I/O: same discipline as
// the vendored engine, because the verification ledger runs this headless.
//
// The premise, in one line: the F-117A's actual defence was terrain masking, so
// what hides you here is a live cell standing between you and the emitter — and
// because the substrate is an automaton, that cover MOVES. Reading the phase is
// how you stay masked.
//
// Two facts, both established by measurement rather than by reasoning, drive the
// design of this file. They are stated here because they are easy to
// re-introduce by "tidying" the code.
//
// (1) A RADAR MUST NOT OCCLUDE ITSELF.
//     Sensors are beehives: six live cells. A ray cast from the sensor's centroid
//     starts INSIDE those live cells, so a naive implementation reports every
//     target as blocked. Measured during design: 3 of 1025 lattice points
//     painted, i.e. the radar network was blind. Every sensor therefore carries
//     an `exempt` set of its own footprint, skipped during traversal.
//
// (2) THE LINE MUST BE SUPERCOVER, NOT BRESENHAM.
//     Bresenham picks ONE cell per major-axis step, so a ray crossing a diagonal
//     wall slips between two diagonally-adjacent live cells and sees through
//     solid cover. Supercover returns every cell the segment touches, including
//     both cells at an exact corner crossing. Claim C2 tests precisely this.

/**
 * Supercover line: every grid cell the segment (x0,y0)->(x1,y1) touches.
 *
 * Dedu's supercover variant of Bresenham. Where the segment passes exactly
 * through a lattice corner, BOTH straddling cells are emitted — that is the
 * property that stops a ray leaking through a diagonal wall.
 *
 * `visit(x, y)` may return `true` to stop early; the walk then returns `true`.
 */
function supercover(x0, y0, x1, y1, visit) {
  let x = x0, y = y0;
  if (visit(x, y)) return true;

  let dx = x1 - x0, dy = y1 - y0;
  const xstep = dx < 0 ? -1 : 1;
  const ystep = dy < 0 ? -1 : 1;
  dx = Math.abs(dx); dy = Math.abs(dy);
  const ddx = 2 * dx, ddy = 2 * dy;

  if (ddx >= ddy) {
    let err = dx, errPrev = dx;
    for (let i = 0; i < dx; i++) {
      x += xstep;
      err += ddy;
      if (err > ddx) {
        y += ystep;
        err -= ddx;
        // Which cell(s) did we clip on the way through the corner?
        if (err + errPrev < ddx) { if (visit(x, y - ystep)) return true; }
        else if (err + errPrev > ddx) { if (visit(x - xstep, y)) return true; }
        else { // exact corner — both, or the ray leaks through the diagonal
          if (visit(x, y - ystep)) return true;
          if (visit(x - xstep, y)) return true;
        }
      }
      if (visit(x, y)) return true;
      errPrev = err;
    }
  } else {
    let err = dy, errPrev = dy;
    for (let i = 0; i < dy; i++) {
      y += ystep;
      err += ddx;
      if (err > ddy) {
        x += xstep;
        err -= ddy;
        if (err + errPrev < ddy) { if (visit(x - xstep, y)) return true; }
        else if (err + errPrev > ddy) { if (visit(x, y - ystep)) return true; }
        else {
          if (visit(x - xstep, y)) return true;
          if (visit(x, y - ystep)) return true;
        }
      }
      if (visit(x, y)) return true;
      errPrev = err;
    }
  }
  return false;
}

/**
 * Is (tx,ty) visible from (sx,sy) through `grid`?
 *
 * Endpoints never occlude: the emitter sits in its own footprint, and the
 * target is the thing being looked at. `exempt` (a Set of y*W+x) additionally
 * skips the emitter's whole footprint — see note (1) at the top of this file.
 */
function hasLOS(grid, W, H, sx, sy, tx, ty, exempt) {
  const blocked = supercover(sx, sy, tx, ty, (x, y) => {
    if (x === sx && y === sy) return false;
    if (x === tx && y === ty) return false;
    if (x < 0 || y < 0 || x >= W || y >= H) return false;
    const i = y * W + x;
    if (exempt && exempt.has(i)) return false;
    return grid[i] === 1;
  });
  return !blocked;
}

/** Squared range test, kept integer so it cannot drift between callers. */
function inRange(sx, sy, tx, ty, range) {
  const dx = tx - sx, dy = ty - sy;
  return dx * dx + dy * dy <= range * range;
}

/**
 * Normalise a level's sensor declarations into the form this module wants:
 * a centroid to cast from, a footprint to exempt, and a range.
 */
function prepareSensors(sensors, W, DEFAULT_RANGE = 45) {
  return sensors.map((s) => {
    let sx = 0, sy = 0;
    for (const [x, y] of s.cells) { sx += x; sy += y; }
    return {
      name: s.name,
      cx: Math.round(sx / s.cells.length),
      cy: Math.round(sy / s.cells.length),
      range: s.range ?? DEFAULT_RANGE,
      exempt: new Set(s.cells.map(([x, y]) => y * W + x)),
      cells: s.cells,
    };
  });
}

/**
 * Which sensors currently paint `cells`?
 *
 * A single exposed cell paints the aircraft. This is the CONSERVATIVE reading
 * and it is a design decision, not an accident: requiring every cell to be
 * exposed would make the glider's own 5-cell spread act as free cover, and the
 * mask you are reading off the substrate would stop meaning what it looks like
 * it means.
 */
function paintedBy(grid, W, H, sensors, cells) {
  const hits = [];
  for (const s of sensors) {
    for (const [x, y] of cells) {
      if (!inRange(s.cx, s.cy, x, y, s.range)) continue;
      if (hasLOS(grid, W, H, s.cx, s.cy, x, y, s.exempt)) { hits.push(s.name); break; }
    }
  }
  return hits;
}

/**
 * Ground shadow: a Uint8Array over the whole grid, 1 where a hypothetical
 * target would be painted. Drives the on-screen shadow overlay and the C4
 * "is the shadow load-bearing?" metric.
 *
 * COST: O(W*H*sensors*ray). Recompute this ON CA TICK, never per animation
 * frame — the automaton advances at a couple of hertz and the renderer at
 * sixty, so a per-frame recompute is ~30x wasted work and will stutter.
 */
function shadowMap(grid, W, H, sensors) {
  const out = new Uint8Array(W * H);
  for (const s of sensors) {
    const r = s.range;
    const x0 = Math.max(0, s.cx - r), x1 = Math.min(W - 1, s.cx + r);
    const y0 = Math.max(0, s.cy - r), y1 = Math.min(H - 1, s.cy + r);
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const i = y * W + x;
        if (out[i]) continue;
        if (!inRange(s.cx, s.cy, x, y, r)) continue;
        if (hasLOS(grid, W, H, s.cx, s.cy, x, y, s.exempt)) out[i] = 1;
      }
    }
  }
  return out;
}

/**
 * Exposure accumulator. Dwell, not instant death.
 *
 * Instant death on first paint would be unreadable: the shadow breathes with
 * the oscillators, so a single-generation flicker of exposure is normal play,
 * not a mistake. Sustained exposure is the mistake. Rising and falling by one
 * per generation makes the HUD number a legible countdown in both directions.
 */
const LOCK = 8;

function stepExposure(prev, painted) {
  if (painted) return prev + 1;
  return prev > 0 ? prev - 1 : 0;
}

const T = gliderTables();
const CUM = {};
for (const hk of Object.keys(T)) {
  const d = T[hk].deltas, c = [[0, 0]];
  for (let p = 0; p < 3; p++) c.push([c[p][0] + d[p][0], c[p][1] + d[p][1]]);
  CUM[hk] = c;
}
function laneOf(hk, ax, ay, p) {
  const [cx, cy] = CUM[hk][p];
  const [sx, sy] = hk.split(',').map(Number);
  return sx * sy > 0 ? (ax - cx) - (ay - cy) : (ax - cx) + (ay - cy);
}

function createMission(L) {
  const { W, H } = L;
  const world = mkGrid(W, H), scratch = mkGrid(W, H);
  for (const [cells, ox, oy] of L.stamps) stamp(world, W, cells, ox, oy);
  return {
    L, W, H, world, scratch, shadow: null, sscratch: null,
    t: 0, state: 'FLIGHT',
    player: { anchor: [...L.spawn], heading: [...L.spawnHeading], phase: 0, queued: null },
    contactT: 0, contactPos: null, landT: 0,
    diverged: new Uint8Array(W * H), trace: 0,
    alarm: null, splices: [], result: null, endT: null,
    // >>> FORK: radar state.
    // `radar` is the prepared sensor list (centroid + own-footprint exemption +
    // range); `exposure` is the dwell counter; `painted` is who sees you right
    // now, for the HUD. `peakExposure` is kept for the debrief: "you were never
    // seen" and "you were at 7 of 8 twice" are very different flights, and
    // without it the debrief cannot tell them apart.
    radar: prepareSensors(L.sensors, W, L.radarRange ?? 45),
    exposure: 0, peakExposure: 0, painted: [], lockedBy: null,
    // <<< FORK
  };
}

function playerCells(M) {
  const { anchor, heading, phase } = M.player;
  return T[heading.join(',')].shapes[phase].map(([x, y]) => [x + anchor[0], y + anchor[1]]);
}

function nearWorld(M, cells, r) {
  const { world, W, H } = M;
  for (const [x, y] of cells) {
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      if (world[ny * W + nx]) return true;
    }
  }
  return false;
}

function inHangar(M, cells) {
  const z = M.L.hangarZone;
  return cells.some(([x, y]) => x >= z[0] && y >= z[1] && x <= z[2] && y <= z[3]);
}

function splice(M, cells) {
  if (!M.shadow) { M.shadow = M.world.slice(); M.sscratch = new Uint8Array(M.W * M.H); }
  for (const [x, y] of cells) M.world[y * M.W + x] = 1;
  M.splices.push({ t: M.t, cells });
}

function checkSensors(M) {
  if (!M.shadow || M.state === 'LANDING' || M.result) return;
  for (const s of M.L.sensors) {
    for (const [x, y] of s.cells) {
      const i = y * M.W + x;
      if (M.world[i] !== M.shadow[i]) {
        // direct if any splice happened within Chebyshev 3 of this sensor
        let direct = false;
        for (const sp of M.splices) for (const [px, py] of sp.cells) {
          for (const [qx, qy] of s.cells) if (Math.max(Math.abs(px - qx), Math.abs(py - qy)) <= 3) direct = true;
        }
        M.alarm = { sensor: s.name, mode: direct ? 'DIRECT' : 'WAKE', t: M.t };
        M.state = 'ENDED'; M.result = 'DETECTED'; M.endT = M.t;
        return;
      }
    }
  }
}

function updateTrace(M) {
  if (!M.shadow || M.state === 'LANDING' || (M.state === 'ENDED' && (M.result === 'LANDED' || M.result === 'CRASH_LANDING'))) return;
  const { world, shadow, diverged, W, H } = M;
  for (let i = 0; i < W * H; i++) {
    if (!diverged[i] && world[i] !== shadow[i]) { diverged[i] = 1; M.trace++; }
  }
}

// World + shadow keep evolving (used after mission end, and by the harness's ash-reach probe).
function ambientStep(M) {
  step(M.world, M.scratch, M.W, M.H); [M.world, M.scratch] = [M.scratch, M.world];
  if (M.shadow) {
    step(M.shadow, M.sscratch, M.W, M.H); [M.shadow, M.sscratch] = [M.sscratch, M.shadow];
    const { world, shadow, diverged, W, H } = M;
    for (let i = 0; i < W * H; i++) if (!diverged[i] && world[i] !== shadow[i]) { diverged[i] = 1; M.trace++; }
  }
  M.t++;
}
// >>> FORK: radar evaluation. No equivalent upstream.
//
//
// Exposure rises by one per painted generation and decays by one per clean one.
// Reaching LOCK ends the mission as PAINTED. Dwell rather than instant death is
// deliberate: the shadow breathes with the oscillators, so a one-generation
// flicker of exposure is ordinary play. Sustained exposure is the mistake.
function checkRadar(M) {
  if (M.result || M.state !== 'FLIGHT') return;
  const cells = playerCells(M);
  M.painted = paintedBy(M.world, M.W, M.H, M.radar, cells);
  M.exposure = stepExposure(M.exposure, M.painted.length > 0);
  if (M.exposure > M.peakExposure) M.peakExposure = M.exposure;
  if (M.exposure >= LOCK) {
    M.lockedBy = M.painted[0] ?? M.lockedBy;
    M.state = 'ENDED'; M.result = 'PAINTED'; M.endT = M.t;
  }
}
// <<< FORK

// One generation. input = desired heading [hx,hy] or null.
function missionStep(M, input) {
  const { W, H } = M;
  if (M.result) return;

  if (M.state === 'FLIGHT') {
    if (input) M.player.queued = input;
    if (M.player.queued && M.player.phase === 0) {
      const q = M.player.queued;
      if (q[0] !== M.player.heading[0] || q[1] !== M.player.heading[1]) M.player.heading = [q[0], q[1]];
      M.player.queued = null;
    }
    const cells = playerCells(M);
    // bounds
    for (const [x, y] of cells) if (x < 1 || y < 1 || x >= W - 1 || y >= H - 1) {
      M.state = 'ENDED'; M.result = 'ABORT_EDGE'; M.endT = M.t; return;
    }
    if (nearWorld(M, cells, 2)) {
      splice(M, cells);
      if (inHangar(M, cells)) { M.state = 'LANDING'; M.landT = 0; }
      else { M.state = 'CONTACT'; M.contactT = 0; M.contactPos = [...M.player.anchor]; }
    } else {
      const d = T[M.player.heading.join(',')].deltas[M.player.phase];
      M.player.anchor = [M.player.anchor[0] + d[0], M.player.anchor[1] + d[1]];
      M.player.phase = (M.player.phase + 1) % 4;
    }
  }

  step(M.world, M.scratch, W, H); [M.world, M.scratch] = [M.scratch, M.world];
  if (M.shadow) { step(M.shadow, M.sscratch, W, H); [M.shadow, M.sscratch] = [M.sscratch, M.shadow]; }
  M.t++;
  updateTrace(M);
  checkSensors(M);
  if (M.result) return;
  // >>> FORK: the radar channel.
  //
  // Independent of trace. Trace is what you DISTURB; radar is what SEES you.
  // A perfect trace-0 flight down an exposed corridor is still a dead flight,
  // and that separation is the whole F-117A premise.
  //
  // Evaluated only in FLIGHT. In CONTACT the aircraft has been spliced into the
  // substrate and its cells ARE substrate cells, so "painted" has no referent;
  // that state already resolves within 26 generations to reacquisition or MIA,
  // and trace is accruing throughout. In LANDING the approach is committed.
  checkRadar(M);
  if (M.result) return;
  // <<< FORK

  if (M.state === 'CONTACT') {
    M.contactT++;
    const [cx, cy] = M.contactPos, R = 15;
    const g = findGlider(M.world, W, H, T, cx - R, cy - R, cx + R, cy + R, M.shadow);
    if (g) {
      const sh = T[g.heading.join(',')].shapes[g.phase];
      for (const [x, y] of sh) M.world[(y + g.oy) * W + (x + g.ox)] = 0;
      M.player = { anchor: [g.ox, g.oy], heading: g.heading, phase: g.phase, queued: null };
      M.state = 'FLIGHT'; M.reacquired = (M.reacquired || 0) + 1;
    } else if (M.contactT > 26) {
      M.state = 'ENDED'; M.result = 'MIA'; M.endT = M.t;
    }
  } else if (M.state === 'LANDING') {
    M.landT++;
    if (M.landT >= 70) {
      const z = M.L.hangarZone;
      const eset = new Set(M.L.hangarCells.map(([x, y]) => `${x},${y}`));
      let clean = true;
      for (let y = z[1]; y <= z[3]; y++) for (let x = z[0]; x <= z[2]; x++) {
        const v = M.world[y * W + x];
        if (v !== (eset.has(`${x},${y}`) ? 1 : 0)) clean = false;
      }
      M.state = 'ENDED'; M.endT = M.t;
      M.result = clean ? 'LANDED' : 'CRASH_LANDING';
    }
  }
}

// Operation Nightglass — level data. NEW; f19's Operation Nightstep level is not
// reused, and the reason is a measurement rather than a preference.
//
// -------------------------------------------------------------------------
// WHY NOT f19's LEVEL
// -------------------------------------------------------------------------
// Nightstep's terrain is still lifes and a glider stream. Supercover LOS was run
// over it from its three sensors, range 45, for 60 generations on a 1025-cell
// lattice. Of 528 cells ever painted, 521 were painted at EVERY generation.
// Seven were phase-dependent. Mean churn: 1.14 cells per generation.
//
// A radar layer over that terrain would be scenery — the exact failure the f19
// design falsifier names. Cover has to MOVE, so the terrain here is oscillators.
//
// -------------------------------------------------------------------------
// WHY NO GOSPER GUN
// -------------------------------------------------------------------------
// Nightstep's field takes 347 generations to become periodic: the gun at (2,2)
// must fill the whole stream to the absorber at (114,100) before anything
// repeats. Until then "substrate phase" does not exist, and the mission starts
// at t=0 — inside the transient. A solver indexing states by `t mod 30` would be
// searching a space that has not formed yet.
//
// Oscillators are periodic from generation 0. Dropping the gun makes the
// transient ZERO by construction rather than by tuning, so `phase = t mod P` is
// well-defined on the very first tick. Claim C11 measures this rather than
// trusting it. The stream is not missed: in this game the threat is being SEEN,
// not being hit.
//
// -------------------------------------------------------------------------
// THE SHAPE OF THE PUZZLE
// -------------------------------------------------------------------------
// A glider flies one diagonal step per four generations and may only turn at
// phase 0, so the route is a coarse diagonal staircase. The corridor runs
// north-west to south-east along y = x + 4.
//
// Sensors sit off the corridor's flanks, looking ACROSS it — north-east and
// south-west, i.e. perpendicular to the direction of travel, so a sight line
// crosses the route rather than running along it. Between each sensor and the
// corridor stands a SHUTTER BANK of oscillators, laid parallel to the corridor.
// As the bank cycles, the sight lines through it open and close.
//
// Periods present: pentadecathlon 15, pulsar 3, and the glider's own 4. The
// substrate period is therefore lcm(3,15) = 15 — measured, not assumed, by
// design/measure.mjs and pinned by claim C11.


// --- oscillators. Periods verified empirically; see C11 and design/period.mjs.
const OSC = {
  blinker: parseRLE('3o!'),                                    // p2
  toad: parseRLE('b3o$3o!'),                                   // p2
  beacon: parseRLE('2o2b$2o2b$2b2o$2b2o!'),                    // p2
  pulsar: parseRLE(                                            // p3, 13x13
    '2b3o3b3o2b$9b$o4bobo4bo$o4bobo4bo$o4bobo4bo$2b3o3b3o2b$9b$'
    + '2b3o3b3o2b$o4bobo4bo$o4bobo4bo$o4bobo4bo$9b$2b3o3b3o2b!'),
  penta: parseRLE('2bo4bo2b$2ob4ob2o$2bo4bo2b!'),              // p15, 10x3
};

// lcm of the oscillator periods actually placed. This was 30 while the level
// carried blinkers/beacons/toads (p2) in its flanking banks; removing those
// banks removed the factor of 2, and C11 caught the stale declaration at once —
// "period is the declared 30 (measured 15)". Declared values that are not
// re-measured are how a level quietly stops meaning what its docs say.
const PERIOD = 15;   // lcm(15 pentadecathlon, 3 pulsar). Asserted by C11.

/**
 * A shutter bank: `n` oscillators laid along the corridor direction (1,1),
 * starting at (x,y) and stepping by `gap` diagonally. `kinds` cycles.
 *
 * `gap` MUST exceed the largest pattern's bounding box, or neighbouring
 * oscillators touch and react. The first draft of this level used gap 9 with a
 * 13x13 pulsar in the cycle: every bank member overlapped its neighbour, the
 * collisions sprayed debris, population ran to 579 against ~200 placed cells,
 * and the substrate took 183 generations to settle instead of being periodic
 * at t=0. The level looked fine; only design/measure.mjs found it.
 *
 * Claim C12 (verify-level-sanity.mjs) now enforces the separation mechanically,
 * so this cannot regress by someone nudging a number.
 */
function bank(x, y, n, gap, kinds) {
  const out = [];
  for (let i = 0; i < n; i++) {
    out.push([kinds[i % kinds.length], x + i * gap, y + i * gap]);
  }
  return out;
}

/**
 * A wall laid ACROSS the corridor — along (1,-1), perpendicular to the flight
 * direction — with a single gap.
 *
 * This is what makes phase load-bearing. Shutter banks flanking an open
 * corridor do not: the solver simply routes around them through permanent
 * cover, which is exactly what made claim C6 red. A wall the route MUST pass
 * through turns "where is there cover?" into "WHEN is the gap masked?".
 *
 * Blocks are 2x2 spaced 5 along the wall, so bounding boxes clear by 3 (C12's
 * minimum) while the 3-cell openings between them are far too narrow to fly:
 * the aircraft dies within Chebyshev 2 of any live cell, so a passable gap
 * needs roughly 7 clear cells. Only the declared gap is passable.
 */
function wall(cx, cy, W, H, gapWide = 1, step = 5) {
  const out = [];
  // Walk the line (cx+k*step, cy-k*step) in BOTH directions until it leaves the
  // grid. A fixed half-width is what made the first chokepoint fake: it spanned
  // 50 cells of a line whose in-bounds length is about 106, so there was open
  // map beyond both ends and the solver simply flew around. A gap is only a
  // chokepoint if there is no way past the ends.
  for (let k = -60; k <= 60; k++) {
    if (k >= 0 && k < gapWide) continue;               // the one way through
    const x = cx + k * step, y = cy - k * step;
    if (x < 2 || y < 2 || x > W - 4 || y > H - 4) continue;
    out.push([P.block, x, y]);
  }
  return out;
}

function buildLevel(opts = {}) {
  const W = 172, H = 108;
  const { withSensors = true, radarRange = 40 } = opts;

  // The hangar is a sym-4 eater, as in f19: it catches an arriving SE glider.
  const E4 = xf(P.eater1, 4);
  const hangarAt = [92, 96];
  const hangarCells = E4.map(([x, y]) => [x + hangarAt[0], y + hangarAt[1]]);
  let hx0 = Infinity, hy0 = Infinity, hx1 = -1, hy1 = -1;
  for (const [x, y] of hangarCells) {
    hx0 = Math.min(hx0, x); hy0 = Math.min(hy0, y);
    hx1 = Math.max(hx1, x); hy1 = Math.max(hy1, y);
  }

  // --- shutter banks, laid parallel to the corridor between sensor and route.
  // Flanking shutter banks were REMOVED after claim C6 measured them ineffective:
  // with an open corridor the solver simply routed around them through permanent
  // cover, and the witness route's exposure came out phase-invariant (7/8 at all
  // 30 phases). Cover beside a route you need not take is scenery. The
  // chokepoint below replaces them. Only the late bank is kept, far from the
  // gate, as terrain interest.
  // gap 16 > the 13x13 pulsar, so no two members touch. See bank() and C12.
  const banks = [
    ...bank(96, 68, 2, 16, [OSC.penta, OSC.pulsar]),
  ];

  // --- THE CHOKEPOINT. The corridor is y = x + 4; the wall crosses it at
  // (chokeX, chokeX + 4) and the gap is the only way south.
  const {
    chokeX = 56, shutterAt = [68, 68], gateSensor = [79, 73], wallN = 5,
    gateRange = 23, gapWide = 1,
    // gate2 was the hypothesis of a SECOND emitter — two sight lines onto the
    // gap, safe only when both are blocked. It measured DEAD: a 2,016-config
    // sweep of second-emitter positions produced zero viable levels (every
    // candidate collided, broke periodicity, or sealed the map at all phases).
    // What worked instead is a second SHUTTER on the one emitter — see below.
    // The option is kept because the sweep that killed it is not in this file.
    gate2 = null, gate2Range = 22, shutter2At = [66, 79],
  } = opts;
  const choke = wall(chokeX, chokeX + 4, W, H, gapWide);

  // TWO shutters, one emitter, both GRAZING — and every number here is a
  // measurement (design/place.mjs pipeline; see verify-falsifier.mjs).
  //
  // Tangency first. A pentadecathlon squarely ON a sight line (e.g. [64,64])
  // masks it at every phase — 15/15 launches land, peak exposure a flat 7..7,
  // the automaton contributes nothing. Grazing at [68,68], only its extended
  // phases occlude, and detection becomes phase-dependent. That got C6 from
  // 0/30 to 4/14. Not a majority.
  //
  // The second penta, [66,79], exists to close a HOLE rather than to add
  // cover. With the gate at range 22 the solver found a phase-invariant
  // escape: a zigzag hugging the range circle on the egress leg, dipping into
  // the disc for 3-4 generations and letting the dwell counter drain between
  // dips — peak exposure 4, landing at all 15 phases without reading the
  // substrate at all. Range 23 closes the duck cells; alone that seals the
  // level shut at every phase, so [66,79] lies across the gate-to-egress rays
  // and its extended phases re-open the crossing. The pair is a one-cell
  // optimum: [67,79] measures 1/14 painted, [66,80] measures 4/14, and
  // [66,79] measures 14/14 with the on-phase flight landing — while the
  // exhaustive search finds NO route anywhere that stays below exposure 7
  // (C6's fourth assertion).
  const shutter = [
    [OSC.penta, shutterAt[0], shutterAt[1]],
    ...(shutter2At ? [[OSC.penta, shutter2At[0], shutter2At[1]]] : []),
  ];

  // --- still-life terrain: collision hazard, and permanent cover. Kept sparse:
  // permanent cover that is too generous makes the moving cover irrelevant.
  // Every one of these must clear every bank member. Two of them originally did
  // not — a beehive at (60,30) sat 2 cells from the first pulsar and a block at
  // (110,70) sat 1 cell from the third — and those two contacts alone took the
  // substrate from periodic-at-t=0 to a 621-generation transient. Bisection,
  // not inspection, found them; C12 now enforces the clearance.
  const terrain = [
    [P.beehive, 20, 12], [P.boat, 140, 92], [P.block, 128, 30], [P.tub, 150, 50],
  ];

  // --- sensors. RDR-GATE watches the chokepoint gap specifically; the others
  // deny the flanks so the gap cannot simply be walked around.
  const sensors = withSensors ? [
    { name: 'RDR-1', cells: P.beehive.map(([x, y]) => [x + 88, y + 8]) },
    { name: 'RDR-2', cells: P.beehive.map(([x, y]) => [x + 14, y + 74]) },
    { name: 'RDR-3', cells: P.beehive.map(([x, y]) => [x + 140, y + 66]) },
    // RDR-GATE has its OWN, short range. At the shared range it covered the
    // whole ingress and killed the aircraft 20 cells before the wall, which
    // makes the approach the puzzle instead of the gate. A short range is what
    // localises the threat to the chokepoint, where the shutter can modulate it.
    //
    // Its position and range are MEASURED, not chosen, and the level balances
    // on them. An exposure diagnostic showed every launch phase peaking at 7
    // or 8 of LOCK=8 — one dwell generation decides every flight — and at this
    // range (23) the sensor no longer even sees the gap (distance 28.7): the
    // decisive zone is the EGRESS corridor, where the route skirts the range
    // disc. (79,73)/23 with the twin shutters above gives 14/14 off-phase
    // PAINTED, an on-phase landing, and no sub-LOCK route in the whole state
    // space; the old (76,74)/20 measured 4/14 and admitted a peak-4 escape.
    // Nudging this sensor without re-running design/place.mjs and the C6
    // falsifier will silently produce a walkover or an impossibility.
    {
      name: 'RDR-GATE', range: gateRange,
      cells: P.beehive.map(([x, y]) => [x + gateSensor[0], y + gateSensor[1]]),
    },
    ...(gate2 ? [{
      name: 'RDR-GATE2', range: gate2Range,
      cells: P.beehive.map(([x, y]) => [x + gate2[0], y + gate2[1]]),
    }] : []),
  ] : [];

  const stamps = [
    [E4, ...hangarAt],
    ...banks.map(([cells, x, y]) => [cells, x, y]),
    ...choke.map(([cells, x, y]) => [cells, x, y]),
    ...shutter.map(([cells, x, y]) => [cells, x, y]),
    ...terrain,
    ...sensors.map((s) => [s.cells, 0, 0]),
  ];

  return {
    W, H, stamps, sensors, terrain, banks, choke, shutter, hangarCells,
    // CLAMPED TO THE GRID, and that is load-bearing rather than tidy.
    // missionStep's landing check sweeps this zone comparing world cells to the
    // eater's footprint. Off-grid reads return undefined, which is never equal
    // to 0, so ANY zone extending past the last row makes every landing report
    // CRASH_LANDING — with no error and no clue. The hangar originally sat at
    // (92,100), pushing the zone to y=109 against a 108-row grid, and every one
    // of 29 approach lanes duly "crashed". f19 never met this because its
    // hangar sat high enough for the zone to fit.
    hangarZone: [
      Math.max(0, hx0 - 6), Math.max(0, hy0 - 6),
      Math.min(W - 1, hx1 + 6), Math.min(H - 1, hy1 + 6),
    ],
    // Spawn shares the eater's diagonal lane: laneOf('1,1') = x - y, and the
    // eater anchors at (92,96), so the lane is -4 and spawn must be on it.
    spawn: [12, 16], spawnHeading: [1, 1],
    hangarAt,
    // The ONLY diagonals on which the eater absorbs an arriving glider cleanly.
    // MEASURED by sweeping every approach lane, not chosen: of 21 lanes tried,
    // 3 land, 12 crash-land and 6 run off the edge. Arriving on any other lane
    // reaches the hangar and still loses. The solver is constrained to these.
    glidepaths: [-10, -4, 3],
    radarRange,
    period: PERIOD,
    transient: 0,             // asserted by C11
    // The nominal corridor, for the design tools and the C4 metric: the
    // diagonal the aircraft would fly with no input at all.
    corridor: { from: [12, 16], to: [92, 96] },

    // The witness route: [generation, headingX, headingY] at each turn.
    //
    // FOUND, NOT DESIGNED. design/solve.mjs searched the full state space
    // (anchor x heading x substrate phase x exposure) and emitted this. It is
    // then FLOWN through the real missionStep() by verify-witness.mjs — the
    // solver is an approximation and is only allowed to propose, so claim C5 is
    // the flight, not the search.
    //
    // The radar range this route depends on is knife-edged, and that is
    // measured: design/sweep.mjs over 21 (range, LOCK) combinations finds
    // EXACTLY ONE solvable — range 40, LOCK 8 — and that one is phase-critical
    // (0/14 off-phase land). Range >=42 is unsolvable; LOCK 5 or 6 at range 40
    // is unsolvable too, which is the no-escape property (C6's fourth
    // assertion) seen from the other side. Changing radarRange without
    // re-running the sweep will silently produce either a walkover or an
    // impossibility.
    witness: [
      [0, 1, 1], [84, 1, -1], [88, 1, 1], [100, 1, -1],
      [104, 1, 1], [176, -1, 1], [180, 1, 1], [204, -1, 1],
      [224, 1, 1], [228, -1, 1], [236, 1, 1], [240, -1, 1],
      [244, 1, 1], [252, -1, 1], [256, 1, 1], [264, -1, 1],
      [268, 1, 1], [280, -1, 1], [284, 1, 1], [368, 1, -1],
      [396, 1, 1],
    ],
  };
}

// -------------------------------------------------------------------------
// COORDINATES (the defect-4 fix, stated once and used everywhere)
// -------------------------------------------------------------------------

// occupies the unit square [x, x+1) x [y, y+1) on the ground plane z = 0.
// spike/world.html died by disagreeing with itself about which axis was
// altitude — its renderer drew the CA's y as height while its collision took
// y as horizontal. Here there is exactly one convention, the camera has no

// UN-REGRESSED prototype (see spike/README.md: the other file deleted the
// mixer and lobotomised the PID to a bare P-term). The full aerodynamic model
// (lift/drag/pitching moment) is deliberately NOT ported: the camera needs
// smooth pursuit and honest-feeling banking, not wing area. What survives is
// the control architecture: PID loops computing commands, an elevon mixer
// turning pitch+roll commands into surface pairs — used here to drive the
// camera's visible bank and pitch, so the "airframe you are riding" leans
// into exactly the manoeuvres the glider actually makes.
//
// The aircraft the player sees is the glider's own 5 live cells, drawn as
// airframe panels at altitude — the game does not invent a fuselage the
// simulation doesn't have. Each panel projects INDEPENDENTLY, so clipping
// one never blanks the aircraft (the defect-7 fix; world.html's fill was
// gated on all five vertices surviving).

// --- controllers, adapted from spike/simulation.html (PIDController L74-88,
// --- ElevonMixer L90-99). Behaviour-identical; only formatting changed.
class PIDController {
  constructor(kp, ki, kd) {
    this.kp = kp; this.ki = ki; this.kd = kd;
    this.integral = 0;
    this.prevError = 0;
  }
  compute(setpoint, current, dt) {
    const error = setpoint - current;
    this.integral += error * dt;
    const derivative = (error - this.prevError) / dt;
    this.prevError = error;
    return (this.kp * error) + (this.ki * this.integral) + (this.kd * derivative);
  }
}

class ElevonMixer {
  mix(pitchCommand, rollCommand) {
    return {
      leftElevon: pitchCommand + rollCommand,
      rightElevon: pitchCommand - rollCommand,
      pitch: pitchCommand,
      roll: rollCommand,
    };
  }
}

// --- camera -----------------------------------------------------------------

// Chase geometry. BACK/UP place the eye behind and above the glider along its
// heading; FLY_Z is the altitude the airframe panels render at. All in cells.
const BACK = 13, UP = 9, FLY_Z = 2.0;
const NEAR = 0.5;               // camera-space clip plane (cells)
const FOV = 1.15;               // vertical field of view, radians

function createCamera(L) {
  const [sx, sy] = L.spawn;
  const [hx, hy] = L.spawnHeading;
  const n = Math.hypot(hx, hy);
  const cam = {
    // pose
    pos: [sx - (hx / n) * BACK, sy - (hy / n) * BACK, UP],
    yaw: Math.atan2(hy, hx),    // 0 = +x, positive toward +y
    pitch: Math.atan2(UP - FLY_Z, BACK),
    roll: 0,
    // pursuit state
    vel: [0, 0, 0],
    // controllers: position pursuit per axis, yaw pursuit, and the mixer
    // shaping the visible attitude. Gains tuned for the glider's 1 cell per
    // 4 generations pace at the shipped speeds; deterministic by construction.
    pidX: new PIDController(6.0, 0.0, 4.4),
    pidY: new PIDController(6.0, 0.0, 4.4),
    pidZ: new PIDController(6.0, 0.0, 4.4),
    pidYaw: new PIDController(7.0, 0.0, 3.2),
    mixer: new ElevonMixer(),
  };
  return cam;
}

// Shortest signed angular difference a-b, in (-PI, PI].
function angDiff(a, b) {
  let d = a - b;
  while (d > Math.PI) d -= 2 * Math.PI;
  while (d <= -Math.PI) d += 2 * Math.PI;
  return d;
}

/**
 * Advance the chase camera toward the glider. Pure in everything but `cam`,
 * which is renderer-owned state (never mission state). dt is supplied by the
 * caller — this module has no clock.
 *
 * target: [x, y] glider anchor (cells); heading: [hx, hy] current heading.
 */
function stepCamera(cam, target, heading, dt) {
  if (dt <= 0) return cam;
  const n = Math.hypot(heading[0], heading[1]) || 1;
  const dir = [heading[0] / n, heading[1] / n];
  const want = [
    target[0] + 0.5 - dir[0] * BACK,
    target[1] + 0.5 - dir[1] * BACK,
    UP,
  ];
  // PID pursuit -> acceleration, integrated with damping. The damping factor
  // is what keeps the discrete 4-generation hops of the glider from arriving
  // in the camera as kicks.
  const acc = [
    cam.pidX.compute(want[0], cam.pos[0], dt),
    cam.pidY.compute(want[1], cam.pos[1], dt),
    cam.pidZ.compute(want[2], cam.pos[2], dt),
  ];
  for (let i = 0; i < 3; i++) {
    cam.vel[i] = (cam.vel[i] + acc[i] * dt) * Math.max(0, 1 - 2.2 * dt);
    cam.pos[i] += cam.vel[i] * dt;
  }
  // Yaw pursues the heading; the yaw-rate command becomes the roll command
  // through the mixer, so the view banks into turns and levels out of them.
  const wantYaw = Math.atan2(dir[1], dir[0]);
  const yawRate = cam.pidYaw.compute(0, angDiff(cam.yaw, wantYaw), dt);
  cam.yaw += yawRate * dt;
  const surfaces = cam.mixer.mix(
    0.22 * (cam.pos[2] - FLY_Z) / UP,     // pitch command: settle onto the sightline
    Math.max(-0.5, Math.min(0.5, -0.35 * yawRate)),
  );
  const wantPitch = Math.atan2(cam.pos[2] - FLY_Z, BACK) + surfaces.pitch * 0.2;
  cam.pitch += angDiff(wantPitch, cam.pitch) * Math.min(1, 3 * dt);
  cam.roll += angDiff(surfaces.roll, cam.roll) * Math.min(1, 4 * dt);
  return cam;
}

// --- projection --------------------------------------------------------------

/**
 * World point -> [screenX, screenY, camDepth], or null when the point is on
 * or behind the near plane. Null is PER POINT: callers that draw multi-point
 * shapes decide their own policy, and the airframe draws per panel precisely
 * so that one clipped panel cannot blank the aircraft.
 */
function project(cam, x, y, z, vw, vh) {
  // translate
  let px = x - cam.pos[0], py = y - cam.pos[1], pz = z - cam.pos[2];
  // yaw: rotate world so camera looks along +x'
  const cy = Math.cos(-cam.yaw), sy = Math.sin(-cam.yaw);
  let tx = px * cy - py * sy, ty = px * sy + py * cy;
  // pitch: about the camera's y axis (looking down by cam.pitch)
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  let dx = tx * cp - pz * sp;           // depth along the view axis
  let dz = tx * sp + pz * cp;           // up in camera frame
  // roll: about the view axis
  const cr = Math.cos(cam.roll), sr = Math.sin(cam.roll);
  const rx = ty * cr - dz * sr, rz = ty * sr + dz * cr;
  if (dx <= NEAR) return null;
  const f = (vh / 2) / Math.tan(FOV / 2);
  return [vw / 2 + (rx * f) / dx, vh / 2 - (rz * f) / dx, dx];
}

// --- draw list ---------------------------------------------------------------

// Palette keys, resolved to colours by ui.js. The renderer names WHAT things
// are; presentation decides what they look like.
//   ground | gridline | shadow | cell | sensorCell | hangarCell | player
//   corridor | gapMark | zoneMark | ring | horizon

function quad(cam, pts, vw, vh) {
  const out = [];
  let depth = 0;
  for (const [x, y, z] of pts) {
    const p = project(cam, x, y, z, vw, vh);
    if (!p) return null;                 // small quads: clip whole, never split
    out.push([p[0], p[1]]);
    depth += p[2];
  }
  return { pts: out, depth: depth / pts.length };
}

/**
 * Build the frame's draw list: an array of primitives sorted far-to-near
 * (painter's algorithm), each { kind, pts, depth } with pts in screen space.
 * Pure: reads M and shadow, writes nothing. `shadow` is the Uint8Array from
 * radar.shadowMap, recomputed by the CALLER on CA tick (see radar.mjs cost
 * note) — passing a stale-by-one frame shadow is a presentation choice, not
 * a simulation error, because nothing here feeds back into the mission.
 */
function buildDrawList(M, shadow, cam, vw, vh, sets) {
  const { W, H } = M;
  const L = M.L;
  const prims = [];

  // Ground sheet, TILED. As one giant quad it never draws: some corner is
  // always behind the near plane, quad() culls whole shapes, and the floor of
  // the world silently vanishes — measured, not guessed, from the draw-list
  // probe. 6x4 tiles let the visible ones survive the clip.
  for (let ty = 0; ty < 4; ty++) {
    for (let tx = 0; tx < 6; tx++) {
      const x0 = -40 + (W + 80) * (tx / 6), x1 = -40 + (W + 80) * ((tx + 1) / 6);
      const y0 = -40 + (H + 80) * (ty / 4), y1 = -40 + (H + 80) * ((ty + 1) / 4);
      const g = quad(cam, [[x0, y0, 0], [x1, y0, 0], [x1, y1, 0], [x0, y1, 0]], vw, vh);
      if (g) prims.push({ kind: 'ground', pts: g.pts, depth: 1e9 + g.depth });
    }
  }

  // Grid lines every 8 cells, as thin ground quads — orientation without
  // 18,576 per-cell tints.
  for (let x = 0; x <= W; x += 8) {
    const q = quad(cam, [[x, 0, 0], [x + 0.08, 0, 0], [x + 0.08, H, 0], [x, H, 0]], vw, vh);
    if (q) prims.push({ kind: 'gridline', ...q });
  }
  for (let y = 0; y <= H; y += 8) {
    const q = quad(cam, [[0, y, 0], [W, y, 0], [W, y + 0.08, 0], [0, y + 0.08, 0]], vw, vh);
    if (q) prims.push({ kind: 'gridline', ...q });
  }

  // Radar shadow: per-row RUN-LENGTH MERGED ground quads. The raw map has
  // thousands of painted cells; merging adjacent cells in a row keeps the
  // draw list in the hundreds, which is what lets canvas 2D hold frame rate.
  if (shadow) {
    for (let y = 0; y < H; y++) {
      let x = 0;
      while (x < W) {
        if (!shadow[y * W + x]) { x++; continue; }
        let x1 = x;
        while (x1 < W && shadow[y * W + x1]) x1++;
        const q = quad(cam, [[x, y, 0.02], [x1, y, 0.02], [x1, y + 1, 0.02], [x, y + 1, 0.02]], vw, vh);
        if (q) prims.push({ kind: 'shadow', ...q });
        x = x1;
      }
    }
  }

  // Live cells as unit boxes: top face plus the two side faces that can face
  // the camera. Colour class comes from the caller's prebuilt index sets —
  // set membership, not per-frame classification.
  const w = M.world;
  const CH = 1.0;                        // cell box height
  for (let i = 0; i < w.length; i++) {
    if (!w[i]) continue;
    const x = i % W, y = (i - x) / W;
    const kind = sets && sets.sensor.has(i) ? 'sensorCell'
      : sets && sets.hangar.has(i) ? 'hangarCell' : 'cell';
    const top = quad(cam, [[x, y, CH], [x + 1, y, CH], [x + 1, y + 1, CH], [x, y + 1, CH]], vw, vh);
    if (top) prims.push({ kind, pts: top.pts, depth: top.depth, face: 'top' });
    // south/east faces (grid interior is mostly viewed from the northwest
    // chase line; both faces are cheap and the sorter culls by depth anyway)
    const s = quad(cam, [[x, y + 1, CH], [x + 1, y + 1, CH], [x + 1, y + 1, 0], [x, y + 1, 0]], vw, vh);
    if (s) prims.push({ kind, pts: s.pts, depth: s.depth, face: 'side' });
    const e = quad(cam, [[x + 1, y, CH], [x + 1, y + 1, CH], [x + 1, y + 1, 0], [x + 1, y, 0]], vw, vh);
    if (e) prims.push({ kind, pts: e.pts, depth: e.depth, face: 'side' });
  }

  // Mission furniture on the ground plane: corridor, gap brackets, hangar zone.
  const c = L.corridor;
  const seg = quad(cam, [
    [c.from[0], c.from[1], 0.05], [c.from[0] + 0.4, c.from[1], 0.05],
    [c.to[0] + 0.4, c.to[1], 0.05], [c.to[0], c.to[1], 0.05],
  ], vw, vh);
  if (seg) prims.push({ kind: 'corridor', ...seg });
  const z = L.hangarZone;
  const zone = quad(cam, [[z[0], z[1], 0.05], [z[2] + 1, z[1], 0.05], [z[2] + 1, z[3] + 1, 0.05], [z[0], z[3] + 1, 0.05]], vw, vh);
  if (zone) prims.push({ kind: 'zoneMark', ...zone });

  // Sensor range rings, drawn as ground-plane polylines. RDR-GATE's own
  // short range is the one the whole level balances on; drawing it is not
  // decoration, it is the player's only view of the kill radius.
  for (const s of M.radar) {
    const pts = [];
    let depth = 0, nvis = 0;
    for (let a = 0; a <= 48; a++) {
      const th = (a / 48) * 2 * Math.PI;
      const p = project(cam, s.cx + s.range * Math.cos(th), s.cy + s.range * Math.sin(th), 0.05, vw, vh);
      if (!p) { pts.push(null); continue; }
      pts.push([p[0], p[1]]); depth += p[2]; nvis++;
    }
    if (nvis > 8) prims.push({ kind: 'ring', pts, depth: depth / nvis, open: true });
  }

  // The airframe: the glider's five live cells as independent panels at
  // altitude, each its own quad (the defect-7 fix). In CONTACT the aircraft
  // IS substrate — mission.mjs splices it — so there is nothing separate to
  // draw, which is honest: the player watches their airframe as cells.
  if (M.state === 'FLIGHT') {
    // playerCells arrives through `sets` so this module imports NOTHING —
    // the layering is visible in the import graph, not just asserted.
    const cells = sets.playerCells(M);
    for (const [x, y] of cells) {
      const q = quad(cam, [
        [x + 0.1, y + 0.1, FLY_Z], [x + 0.9, y + 0.1, FLY_Z],
        [x + 0.9, y + 0.9, FLY_Z], [x + 0.1, y + 0.9, FLY_Z],
      ], vw, vh);
      if (q) prims.push({ kind: 'player', pts: q.pts, depth: q.depth - 0.01 });
      // ground contact shadow: readability anchor for altitude
      const sq = quad(cam, [
        [x + 0.2, y + 0.2, 0.06], [x + 0.8, y + 0.2, 0.06],
        [x + 0.8, y + 0.8, 0.06], [x + 0.2, y + 0.8, 0.06],
      ], vw, vh);
      if (sq) prims.push({ kind: 'playerShadow', ...sq });
    }
  }

  prims.sort((a, b) => b.depth - a.depth);
  return prims;
}

      <li>The level is solvable only by reading phase, and that is measured, not scripted: the shipped route flown at all 14 off-phases dies PAINTED 14 times (C6), and an exhaustive search finds <i>no route anywhere</i> that stays below exposure ${LOCK - 1} — every flyable line grazes one generation from death.</li>
      <li>This camera is a spectator, provably: the mission was flown with and without the whole 3D layer and every generation hashed identical (C7). The substrate is periodic from tick 0 with period 15 (C11), the simulation is deterministic (C8), and no two placed patterns can react (C12).</li>
      <li>The world stays 2D because 3D Life has no glider ecology — 180 random soups per rule on a 24³ torus, 0 translating patterns (C9). The three dimensions you are looking at live entirely in the camera.</li>
    </ol>
    <p class="go">H / ESC — close</p>`;

  // ---------- input ----------
  const setH = (ax, v) => { desired = [...(M.player.queued || desired)]; desired[ax] = v; };
  addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'h' || k === 'H') { ledger = !ledger; return; }
    if (k === 'Escape') { ledger = false; return; }
    if (ledger) return;
    if (k === 'Tab') { view = view === '3D' ? 'TAC' : '3D'; e.preventDefault(); return; }
    if (k === 'Enter') {
      if (mode === 'BRIEF') { mode = 'RUN'; launchT = M.t; }
      else if (mode === 'DEBRIEF') { newMission(); mode = 'BRIEF'; }
      return;
    }
    if (k === ' ') { if (mode === 'RUN') paused = !paused; e.preventDefault(); return; }
    if (k === '1' || k === '2' || k === '3') { speed = +k; return; }
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') setH(0, -1);
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') setH(0, 1);
    else if (k === 'ArrowUp' || k === 'w' || k === 'W') setH(1, -1);
    else if (k === 'ArrowDown' || k === 's' || k === 'S') setH(1, 1);
  });
  if ('ontouchstart' in window) {
    const tp = $('tpad'); tp.hidden = false;
    tp.querySelectorAll('button[data-h]').forEach(b => b.addEventListener('touchstart', ev => {
      ev.preventDefault(); desired = b.dataset.h.split(',').map(Number);
    }));
    $('tgo').addEventListener('touchstart', ev => {
      ev.preventDefault();
      if (mode === 'BRIEF') { mode = 'RUN'; launchT = M.t; }
      else if (mode === 'DEBRIEF') { newMission(); mode = 'BRIEF'; }
    });
  }

  // ---------- sim advance ----------
  function advance(gens) {
    for (let i = 0; i < gens; i++) {
      if (mode === 'RUN' && !M.result) missionStep(M, desired);
      else ambientStep(M);
      markAlive();
      if (mode === 'RUN' && M.result && !endSnapshot) {
        endSnapshot = { trace: M.trace }; mode = 'DEBRIEF';
      }
    }
    // shadowMap on CA tick, never per frame — see the cost note in radar.mjs.
    if (M.t !== shadowT) { shadow = shadowMap(M.world, M.W, M.H, M.radar); shadowT = M.t; }
  }

  // ---------- 3D view ----------
  function draw3D() {
    cx.fillStyle = C.sky; cx.fillRect(0, 0, CW, CH);
    const prims = buildDrawList(M, shadow, cam, CW, CH, SETS);
    for (const p of prims) {
      if (p.open) {                       // polylines with per-point clip gaps
        cx.strokeStyle = C.ring; cx.beginPath();
        let pen = false;
        for (const pt of p.pts) {
          if (!pt) { pen = false; continue; }
          if (!pen) { cx.moveTo(pt[0], pt[1]); pen = true; } else cx.lineTo(pt[0], pt[1]);
        }
        cx.stroke(); continue;
      }
      const fill = p.face === 'side' ? (SIDE3D[p.kind] || FILL3D[p.kind]) : FILL3D[p.kind];
      if (!fill) continue;
      cx.fillStyle = fill;
      if (p.kind === 'player') { cx.save(); cx.shadowColor = C.playerGlow; cx.shadowBlur = 10; }
      cx.beginPath();
      cx.moveTo(p.pts[0][0], p.pts[0][1]);
      for (let i = 1; i < p.pts.length; i++) cx.lineTo(p.pts[i][0], p.pts[i][1]);
      cx.closePath(); cx.fill();
      if (p.kind === 'player') cx.restore();
    }
    if (M.state === 'CONTACT') banner('AIRFRAME CONTACT', '#ff6655');
    if (mode === 'BRIEF') banner('READY — ENTER TO LAUNCH', C.playerGlow);
  }
  function banner(txt, col) {
    cx.fillStyle = col; cx.font = '12px monospace'; cx.textAlign = 'center';
    cx.fillText(txt, CW / 2, CH - 16); cx.textAlign = 'left';
  }

  // ---------- tactical view ----------
  function drawTac() {
    cx.fillStyle = C.bg; cx.fillRect(0, 0, CW, CH);
    // painted ground: run-length rows straight off the shadow map
    cx.fillStyle = C.shadowTac;
    for (let y = 0; y < L.H; y++) {
      let x = 0;
      while (x < L.W) {
        if (!shadow[y * L.W + x]) { x++; continue; }
        let x1 = x; while (x1 < L.W && shadow[y * L.W + x1]) x1++;
        cx.fillRect(x * CELL, y * CELL, (x1 - x) * CELL, CELL);
        x = x1;
      }
    }
    // corridor + hangar zone + gap label
    cx.strokeStyle = C.corridor; cx.setLineDash([6, 6]);
    cx.beginPath();
    cx.moveTo((L.corridor.from[0] + .5) * CELL, (L.corridor.from[1] + .5) * CELL);
    cx.lineTo((L.corridor.to[0] + .5) * CELL, (L.corridor.to[1] + .5) * CELL);
    cx.stroke(); cx.setLineDash([]);
    const z = L.hangarZone;
    cx.strokeStyle = 'rgba(255,194,62,0.55)'; cx.setLineDash([4, 4]);
    cx.strokeRect(z[0] * CELL + .5, z[1] * CELL + .5, (z[2] - z[0] + 1) * CELL, (z[3] - z[1] + 1) * CELL);
    cx.setLineDash([]);
    cx.fillStyle = 'rgba(255,194,62,0.6)'; cx.font = '9px monospace';
    cx.fillText('HANGAR', z[0] * CELL, z[1] * CELL - 4);
    cx.fillText('THE GAP', 57 * CELL, 58 * CELL);
    // sensor rings + labels, from the PREPARED radar (real centroid + range)
    for (const s of M.radar) {
      cx.strokeStyle = C.ring;
      cx.beginPath(); cx.arc((s.cx + .5) * CELL, (s.cy + .5) * CELL, s.range * CELL, 0, 7); cx.stroke();
      cx.fillStyle = 'rgba(255,85,68,0.7)';
      cx.fillText(s.name, (s.cx + 2) * CELL, (s.cy - 2) * CELL);
    }
    // afterglow + divergence
    const w = M.world, t = M.t;
    for (let i = 0; i < w.length; i++) {
      const x = i % L.W, y = (i - x) / L.W;
      if (!w[i]) {
        const age = t - lastAlive[i];
        if (age >= 0 && age < 14) { cx.fillStyle = C.glow + (0.28 * (1 - age / 14)) + ')'; cx.fillRect(x * CELL, y * CELL, CELL, CELL); }
        if (M.diverged[i]) { cx.fillStyle = C.div + '0.22)'; cx.fillRect(x * CELL + 2, y * CELL + 2, 2, 2); }
      }
    }
    // live cells
    for (let i = 0; i < w.length; i++) if (w[i]) {
      const x = i % L.W, y = (i - x) / L.W;
      cx.fillStyle = sensorSet.has(i) ? C.sensor : hangarSet.has(i) ? C.gold : C.cell;
      cx.fillRect(x * CELL, y * CELL, CELL - 1, CELL - 1);
    }
    // player
    if (mode !== 'DEBRIEF' && M.state === 'FLIGHT') {
      const cells = playerCells(M);
      cx.save(); cx.shadowColor = C.playerGlow; cx.shadowBlur = 8; cx.fillStyle = C.player;
      const dim = mode === 'BRIEF';
      cx.globalAlpha = dim ? 0.55 + 0.25 * Math.sin(performance.now() / 220) : 1;
      for (const [x, y] of cells) cx.fillRect(x * CELL, y * CELL, CELL - 1, CELL - 1);
      cx.restore(); cx.globalAlpha = 1;
      if (dim) { cx.fillStyle = C.playerGlow; cx.font = '9px monospace'; cx.fillText('READY', (M.player.anchor[0] + 4) * CELL, (M.player.anchor[1]) * CELL); }
    }
    if (M.state === 'CONTACT') {
      const [ax, ay] = M.contactPos;
      const blink = (Math.floor(performance.now() / 140) % 2) === 0;
      cx.strokeStyle = blink ? '#ff6655' : '#992222';
      cx.beginPath(); cx.arc((ax + 1.5) * CELL, (ay + 1.5) * CELL, 20 + (M.contactT % 8), 0, 7); cx.stroke();
    }
    if (M.state === 'LANDING') {
      const p = 0.5 + 0.5 * Math.sin(performance.now() / 160);
      cx.strokeStyle = `rgba(255,194,62,${0.35 + 0.5 * p})`; cx.lineWidth = 2;
      cx.strokeRect(z[0] * CELL - 2, z[1] * CELL - 2, (z[2] - z[0] + 1) * CELL + 4, (z[3] - z[1] + 1) * CELL + 4);
      cx.lineWidth = 1;
    }
  }

  // ---------- dial + HUD ----------
  function drawDial() {
    dx.clearRect(0, 0, 56, 56);
    const P = L.period, ph = M.t % P;
    for (let s = 0; s < P; s++) {
      const a = (s / P) * Math.PI * 2 - Math.PI / 2;
      const r0 = 18, r1 = 25, lit = s === ph;
      dx.strokeStyle = lit ? C.amber : 'rgba(255,176,0,0.22)';
      dx.lineWidth = lit ? 3 : 1;
      dx.beginPath();
      dx.moveTo(28 + r0 * Math.cos(a), 28 + r0 * Math.sin(a));
      dx.lineTo(28 + r1 * Math.cos(a), 28 + r1 * Math.sin(a));
      dx.stroke();
    }
    dx.fillStyle = 'rgba(255,176,0,0.7)'; dx.font = '8px monospace'; dx.textAlign = 'center';
    dx.fillText(String(ph).padStart(2, '0'), 28, 31);
    dx.textAlign = 'left';
  }

  function drawHud() {
    $('gen').textContent = M.t;
    const ph = M.state === 'FLIGHT' ? M.player.phase : M.t % 4;
    $('beat').innerHTML = [0, 1, 2, 3].map(i =>
      `<i class="${i === ph ? 'on' : ''}${i === 0 ? ' latch' : ''}"></i>`).join('');
    const hk = (M.player.queued || (mode === 'RUN' ? desired : M.player.heading)).join(',');
    const cur = M.player.heading.join(',');
    $('rose').innerHTML = [['-1,-1', '◤'], ['1,-1', '◥'], ['-1,1', '◣'], ['1,1', '◢']].map(([k2, g]) =>
      `<i class="${k2 === cur ? 'on' : ''} ${k2 === hk && k2 !== cur ? 'q' : ''}">${g}</i>`).join('');
    // the exposure gauge: the dwell counter against LOCK, pip by pip
    $('expo').innerHTML = Array.from({ length: LOCK }, (_, i) =>
      `<i class="${i < M.exposure ? (M.exposure >= LOCK - 2 ? 'hot' : 'on') : ''}"></i>`).join('');
    $('paint').textContent = M.painted.length ? M.painted.join('+') : '—';
    $('paint').className = 'paint' + (M.painted.length ? ' hot' : '');
    const tr = $('trace');
    tr.textContent = endSnapshot ? endSnapshot.trace : M.trace;
    tr.className = 'trace' + (M.trace > 0 ? ' hot' : '');
    $('spd').textContent = speed;
    const tk = $('tick');
    if (mode === 'BRIEF') tk.textContent = 'AWAITING LAUNCH — CLOCK IS LIVE';
    else if (M.state === 'FLIGHT') tk.textContent = paused ? 'RECON HOLD'
      : M.exposure > 0 ? `PAINTED — LOCK IN ${LOCK - M.exposure}` : 'AIRBORNE — TURNS LATCH ON BEAT 1';
    else if (M.state === 'CONTACT') tk.textContent = `AIRFRAME CONTACT — REACQUIRING ${26 - M.contactT}`;
    else if (M.state === 'LANDING') tk.textContent = `TOUCHDOWN SEQUENCE ${M.landT}/70`;
    else if (M.result) tk.textContent = M.result.replace('_', ' ');
    const card = $('card');
    if (ledger) { card.className = 'card show'; card.innerHTML = LEDGER; }
    else if (mode === 'BRIEF') { card.className = 'card show'; card.innerHTML = BRIEF; }
    else if (mode === 'DEBRIEF') { card.className = 'card show'; card.innerHTML = debriefText(); }
    else card.className = 'card';
  }

  // ---------- loop ----------
  function frame(ts) {
    if (!lastTs) lastTs = ts;
    let dt = Math.min(0.1, (ts - lastTs) / 1000); lastTs = ts;
    if (!(paused && mode === 'RUN') && !ledger) {
      acc += dt * GPS[speed];
      const n = Math.floor(acc); acc -= n;
      if (n) advance(Math.min(n, 8));
    }
    stepCamera(cam, [M.player.anchor[0], M.player.anchor[1]], M.player.heading, dt);
    if (view === '3D') draw3D(); else drawTac();
    drawDial(); drawHud();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootF117A);
else bootF117A();

</script></body></html>
